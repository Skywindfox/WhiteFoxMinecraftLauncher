# 非官方分支专用配置：把启动器依赖的第三方服务换成本分支自己的。
#
# 规则：
#   * 留空表示沿用上游默认值；
#   * 每项都可以用同名大写环境变量覆盖（构建时生效），适合放在 CI Secret 里；
#   * 只填写 ASCII 字符（URL、ID、Key），不要写中文。
#
# 涉及的键与作用见 FORK.md。

# 启动器官网，用于关于页、错误提示与下载页链接。留空则指向上游官网。
website=

# 文档站点。留空则指向上游文档站。
# 注意：CHANGELOG_URL / CONTACT_URL / EULA_URL 由它派生，自建站点需要提供
#       /changelog/ 、/help.html 、/eula/hmcl.html 三个路径。
docs=

# 手动更新入口（通常是你 fork 的 Releases 页面）。
manual_update_url=

# 自动更新源（完整 URL）。留空则使用 website + /api/update_link。
# 注意：本分支默认已彻底关闭自更新（见 FORK.md），此项只在显式开启自更新时生效。
update_url=

# 微软 OAuth 应用（公共客户端）的应用 ID，正版登录必需。也可用环境变量 MICROSOFT_AUTH_ID 提供。
microsoft_auth_id=

# CurseForge API Key。留空则 CurseForge 源自动隐藏（Modrinth 不受影响）。
# 也可用环境变量 CURSEFORGE_API_KEY 提供。
curseforge_apikey=

# BMCLAPI 兼容镜像根地址，用于中国大陆的游戏文件镜像（不带结尾斜杠）。
bmclapi_root=

# HMCL 自有元数据镜像根地址（Cleanroom / FML 库 / 未列出游戏版本）。
# 上游默认值属于个人域名，自建时需提供 /metadata/cleanroom/ 、/metadata/fmllibs/ 等路径。
metadata_mirror=

# 模组站镜像根地址（Modrinth / CurseForge / ForgeCDN）。
# 自建时需提供 /modrinth 、/curseforge 等路径。
addon_mirror=

# foojay Disco API 根地址，用于下载 Java 运行时。留空则使用上游默认值。
discoapi_root=
